<div id="content">
<div class="tag-page">

    <header class="tag-header">
        <a href="/notes/" class="note-back">&larr; Notes</a>
        <h1 class="tag-title">
            
            Papershelf
            
        </h1>
        
    </header>

    <div class="tag-notes-controls">
        <div class="tag-notes-sort">
            <button class="sort-btn active" data-sort="recent">Recent</button>
            <button class="sort-btn" data-sort="alpha">A-Z</button>
            <button class="sort-btn" data-sort="status">Status</button>
        </div>
    </div>

    <ul class="tag-notes-list" id="tag-notes-list">
        
    </ul>
    
    

    

    <script>
    (function() {
        const list = document.getElementById('tag-notes-list');
        const items = Array.from(list.querySelectorAll('.tag-note-item'));
        const sortBtns = document.querySelectorAll('.sort-btn');
        const statusOrder = { evergreen: 0, growing: 1, seeding: 2 };
        sortBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sortBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const mode = btn.dataset.sort;
                const sorted = [...items].sort((a, b) => {
                    if (mode === 'alpha') return a.dataset.title.localeCompare(b.dataset.title);
                    if (mode === 'recent') return b.dataset.date.localeCompare(a.dataset.date);
                    if (mode === 'status') return (statusOrder[a.dataset.status] || 2) - (statusOrder[b.dataset.status] || 2);
                    return 0;
                });
                sorted.forEach(item => list.appendChild(item));
            });
        });
    })();
    </script>
