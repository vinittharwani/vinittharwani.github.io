<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> Transformers </title>
<style>
  :root {
    --bg: #FAF9F6;
    --fg: #1A1A16;
    --muted: #6B6A63;
    --accent: #4B5D45;
    --accent-hover: #2E3A29;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15150F;
      --fg: #ECEAE2;
      --muted: #9A988D;
      --accent: #9CB68F;
      --accent-hover: #C3D6B8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15150F;
    --fg: #ECEAE2;
    --muted: #9A988D;
    --accent: #9CB68F;
    --accent-hover: #C3D6B8;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
    font-size: 1.15rem;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 34rem;
    margin: 0 auto;
    padding: clamp(3rem, 12vw, 7rem) 1.5rem 5rem;
  }

  .nav { font-size: 0.95rem; margin-bottom: 2.75rem; }
  .nav a { color: var(--fg); text-decoration: none; margin-right: 1.25rem; }
  .nav a:hover, .nav a:focus-visible { color: var(--fg); }

  h1 {
    font-size: 1.55rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    margin-bottom: 0.4rem;
  }

  .date {
    color: var(--fg);
    font-size: 0.95rem;
    margin-bottom: 2.25rem;
  }

  p { margin-bottom: 1.25rem; max-width: 34rem; }

  a { color: var(--fg); }
  a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .back { margin-top: 2.5rem; font-size: 0.95rem; }

  @media (max-width: 30rem) {
    body { font-size: 1.05rem; }
    .page { padding-top: 3rem; }
  }
</style>
</head>
<body>
  <div class="page">

    <h3> Transformers </h3> <br>

    <p class="nav">
    <a href="/writings">Writings</a></p>
  </div>
</body>
</html>
