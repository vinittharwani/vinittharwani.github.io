<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papers</title>
<style>
  :root {
    --bg: #FAF9F6;
    --fg: #1A1A16;
    --muted: #6B6A63;
    --accent: #4B5D45;
    --accent-hover: #2E3A29;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15150F;
      --fg: #ECEAE2;
      --muted: #9A988D;
      --accent: #9CB68F;
      --accent-hover: #C3D6B8;
    }
  }
  :root[data-theme="light"] {
    --bg: #15150F;
    --fg: #ECEAE2;
    --muted: #9A988D;
    --accent: #9CB68F;
    --accent-hover: #C3D6B8;
  }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  * { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
    font-size: 1.15rem;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 34rem;
    margin: 0 auto;
    padding: clamp(3rem, 12vw, 7rem) 1.5rem 4rem;
  }

  h1 {
    font-size: 1.65rem;
    font-weight: 500;
    margin-bottom: 1.75rem;
    letter-spacing: 0.01em;
  }

  p {
    margin-bottom: 1.25rem;
    max-width: 34rem;
  }

  p.contact {
    margin-top: 2rem;
    color: var(--fg);
  }

  a {
    color: var(--fg);

  }
  
  a:hover, a:focus-visible {
    color: var(--accent-fg);
  }

  a:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
  }

  .nav {
    font-size: 0.95rem;
    margin-bottom: 2.75rem;
  }

  .nav a {
    color: var(--fg);
    text-decoration: none;
  }

  .nav a:hover, .nav a:focus-visible {
    color: var(--fg);
  }

      h2 {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--muted);
    margin: 2.75rem 0 1.25rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.1rem;
  }

  .grid a {
    display: block;
    border-radius: 3px;
    overflow: hidden;
    transition: opacity 0.15s ease;
  }

  .grid a:hover, .grid a:focus-visible {
    opacity: 0.8;
  }

  .grid img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: var(--muted);
  }

  @media (max-width: 30rem) {
    body { font-size: 1.05rem; }
    .page { padding-top: 3rem; }
  }

body {

  font-size: clamp(0.813rem, 1.8vw + 0.5rem, 1.375rem);
  line-height: 1.6;
  }

h1 {

  font-size: clamp(1.5rem, 5vw + 0.5rem, 4.5rem);
  }

h2 {
  font-size: clamp(1.25rem, 3.5vw + 0.5rem, 3rem);
  }


</style>
</head>
<body>
  <div class="page">

<p class="nav">
<a href="/about">About</a>
</p>

    <h3>Papers</h3> <br>

  <p> This section includes the papers, documents and stuff I have either implemented or found interesting.<br>

  </p>

    <div class ="grid">

      <a href="https://arxiv.org/pdf/1706.03762" target="_blank" rel="noopener"><img src="papercovers/attention-is-all-you-need.png" alt="Attention Is All You Need"> </a>

    </div>

</div>
</body>
</html>
