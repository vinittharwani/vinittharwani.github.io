<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing — Vinit</title>
<style>
  :root {
    --bg: #FAF9F6;
    --fg: #1A1A16;
    --muted: #6B6A63;
    --accent: #4B5D45;
    --accent-hover: #2E3A29;
    --rule: rgba(0, 0, 0, 0.08);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15150F;
      --fg: #ECEAE2;
      --muted: #9A988D;
      --accent: #9CB68F;
      --accent-hover: #C3D6B8;
      --rule: rgba(255, 255, 255, 0.1);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15150F;
    --fg: #ECEAE2;
    --muted: #9A988D;
    --accent: #9CB68F;
    --accent-hover: #C3D6B8;
    --rule: rgba(255, 255, 255, 0.1);
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
    font-size: 1.15rem;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 34rem;
    margin: 0 auto;
    padding: clamp(3rem, 12vw, 7rem) 1.5rem 4rem;
  }

  .nav { font-size: 0.95rem; margin-bottom: 2.75rem; }
  .nav a { color: var(--muted); text-decoration: none; }
  .nav a:hover, .nav a:focus-visible { color: var(--accent); text-decoration: underline; }

  h1 {
    font-size: 1.65rem;
    font-weight: 500;
    margin-bottom: 2.25rem;
    letter-spacing: 0.01em;
  }

  a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover, a:focus-visible { color: var(--accent-hover); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ul.posts { list-style: none; }

  ul.posts li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1.25rem;
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--rule);
  }

  ul.posts li:first-child { padding-top: 0; }
  ul.posts li:last-child { border-bottom: none; }

  ul.posts .date {
    color: var(--muted);
    font-size: 0.95rem;
    white-space: nowrap;
  }

  .empty-note {
    color: var(--muted);
    font-size: 1rem;
    margin-top: 0.5rem;
  }

  @media (max-width: 30rem) {
    body { font-size: 1.05rem; }
    .page { padding-top: 3rem; }
    ul.posts li { flex-direction: column; gap: 0.15rem; }
  }
</style>
</head>
<body>
  <div class="page">
    <p class="nav"><a href="../">Vinit</a></p>

    <h1>Writing</h1>

    <ul class="posts">
      <li>
        <a href="notes-on-sequence-modeling.html">Notes on sequence modeling for biology</a>
        <span class="date">Sep 2026</span>
      </li>
    </ul>
  </div>
</body>
</html>
