baseURL = 'https://vinittharwani.github.io/'
languageCode = 'en-us'
title = 'Vinit Tharwani'
theme = "congo"

[params]
  colorScheme = "congo"
  defaultAppearance = "light"
  autoSwitchAppearance = false  

[params.author]
  name = "Vinit Tharwani"
  headline = "Research Engineer"

[menu]
  [[menu.main]]
    name = "Writing"
    url = "/writing/"
    weight = 1

[taxonomies]
  tag = "tags"

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = 'github'
    wrapStandAloneImageWithinParagraph = true
    [markup.goldmark.parser.attribute]
      block = false
      title = true
  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
  [markup.highlight]
    noClasses = false
    style = 'monokai'

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
