baseURL = 'https://vinittharwani.github.io/'
languageCode = 'en-us'
title = 'Vinit Tharwani'
theme = "congo"

[params]
  colorScheme = "congo"
  defaultAppearance = "light"

[params.author]
  name = "Vinit Tharwani"
  headline = "Software Engineer"
  bio = "Currently exploring Deep Learning and Systems Programming."
  links = [
    { X = "https://x.com/vinittharwani" },
    { Newsletter = "https://vinittharwani.substack.com" },
    { YouTube = "https://youtube.com/@vinittharwani" },
    { "Discord Server" = "https://discord.gg/KJWHpUuFJQ" },
  ]

[menu]
  [[menu.main]]
    name = "Notes"
    url = "/notes/"
    weight = 1

  [[menu.main]]
    name = "Blogs"
    url = "/blogs/"
    weight = 2

  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 3

  [[menu.main]]
    name = "Bookshelf"
    url = "/bookshelf/"
    weight = 4

  [[menu.main]]
    name = "Papershelf"
    url = "/papershelf/"
    weight = 5

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 6

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 7

[taxonomies]
  tag = "tags"

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = 'github'
    wrapStandAloneImageWithinParagraph = true
    [markup.goldmark.parser.attribute]
      block = false
      title = true
  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
  [markup.highlight]
    noClasses = false
    style = 'monokai'

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
